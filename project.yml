name: Strumbuddy
options:
  bundleIdPrefix: me.colinwatson
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.5"
settings:
  SWIFT_VERSION: "5.10"
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: "1"
  STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  Strumbuddy:
    type: application
    platform: iOS
    sources:
      - Strumbuddy
    settings:
      INFOPLIST_FILE: Strumbuddy/Resources/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: me.colinwatson.strumbuddy
      DEVELOPMENT_TEAM: M7PCWQ7WYN
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      ENABLE_USER_SCRIPT_SANDBOXING: YES
      TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: []

# v0.1 deliberately ships with NO third-party dependencies.
# The audio engine is built on AVFoundation + Accelerate/vDSP (first-party,
# no copyleft — see docs/design-doc.md §4 licensing note). AudioKit may be
# added later as an optional convenience layer:
#
# packages:
#   AudioKit:
#     url: https://github.com/AudioKit/AudioKit.git
#     from: "5.6.0"
#   AudioKitEX:
#     url: https://github.com/AudioKit/AudioKitEX.git
#     from: "5.6.0"
